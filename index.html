<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>חנות האיפור</title>

<body>
 <!DOCTYPE html>
<html lang="he">
    <head>
        <meta charset="UTF-8">
        <title>Online shop</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        
        <header class="top-header">
            <div class="header-actions">
            <h2 id="username"> שלום, מיכל </h2>
            <a href="cart.html" class="cart-link">
                <img src="cart-icon.png.JPG" alt="cart" class="cart-icon">
            
                <span id="cart-count">0</span>

            </a>
            </div>
        </header>
        <button onclick="addToCart(1)">הוספה לסל - בדיקה </button>
        <script src="data.js"></script>
        <script src="products.js"></script>
       
    </body>
   </html>
   
  <header id="top-bar"></header>

  <!-- מסך הפתיחה: תופס את כל המסך בכניסה -->
  <section class="hero">
    <div class="hero-text">
      <h1 lang="en" dir="ltr">Glow your<br>own way</h1>
      <p>איפור עדין ונעים לכל יום.</p>
      <a href="#categories" class="hero-btn">לקטגוריות</a>
    </div>
  </section>

  <main>
    <!-- הקטגוריות נוצרות אוטומטית מהמוצרים ב-data.js -->
    <section id="categories">
      <h2 class="section-title">קטגוריות</h2>
      <div id="category-list" class="categories"></div>
    </section>

    <section id="shop">
      <h2 class="section-title" id="shop-title">כל המוצרים</h2>
      <div id="products" class="grid"></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="catalog.js"></script>
</body>
</html>
