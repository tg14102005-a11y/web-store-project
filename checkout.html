<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>עמוד תשלום</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 550px;">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        
        <h2 class="card-title text-center mb-4">פרטי תשלום</h2>
        
        <div class="alert alert-primary text-center mb-4">
          סכום לתשלום: <strong id="totalAmount">0</strong> ₪
        </div>

        <form id="paymentForm" novalidate>
          
          <div class="mb-3">
            <label class="form-label">שם מלא</label>
            <input type="text" class="form-control" id="fullName" placeholder="ישראל ישראלי" required>
            <div class="invalid-feedback">נא להזין שם מלא.</div>
          </div>

          <div class="mb-3">
            <label class="form-label">מספר כרטיס אשראי</label>
            <input type="text" class="form-control" id="cardNumber" placeholder="16 ספרות" maxlength="16" pattern="[0-9]{16}" required>
            <div class="invalid-feedback">נא להזין 16 ספרות תקינות.</div>
          </div>

          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">תוקף (MM/YY)</label>
              <input type="text" class="form-control" id="expiry" placeholder="12/28" maxlength="5" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" required>
              <div class="invalid-feedback">פורמט חודש/שנה תקין (MM/YY).</div>
            </div>

            <div class="col-6 mb-3">
              <label class="form-label">CVV</label>
              <input type="text" class="form-control" id="cvv" placeholder="3 ספרות בגב הכרטיס" maxlength="3" pattern="[0-9]{3}" required>
              <div class="invalid-feedback">3 ספרות.</div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fs-5 mt-3">ביצוע תשלום</button>
        </form>

      </div>
    </div>
  </div>

  <div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center p-4">
        <h3 class="text-success mb-3">הרכישה בוצעה בהצלחה!</h3>
        <p id="modalMessage" class="fs-5 text-muted"></p>
        <div>
          <button type="button" class="btn btn-success px-4" id="homeBtn">חזרה לחנות</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
