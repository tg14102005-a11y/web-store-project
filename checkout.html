<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>סיום הזמנה ותשלום</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 650px;">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        
        <h2 class="card-title text-center mb-4">תשלום וסיום הזמנה</h2>
        
        <div class="alert alert-info">
          <div>שלום, <strong id="customerName">אורח</strong>!</div>
          <div class="mt-1">סכום כולל לתשלום: <strong id="totalAmount">0</strong> ₪</div>
        </div>

        <form id="paymentForm" novalidate>
          <div class="mb-3">
            <label class="form-label">כתובת למשלוח</label>
            <input type="text" class="form-control" id="address" placeholder="רחוב, מספר ועיר" required>
            <div class="invalid-feedback">נא להזין כתובת מלאה.</div>
          </div>

          <div class="mb-3">
            <label class="form-label">מספר טלפון</label>
            <input type="tel" class="form-control" id="phone" placeholder="050-0000000" pattern="[0-9]{9,10}" required>
            <div class="invalid-feedback">נא להזין מספר טלפון תקין.</div>
          </div>

          <div class="row">
            <div class="col-md-8 mb-3">
              <label class="form-label">מספר כרטיס אשראי (דמה)</label>
              <input type="text" class="form-control" id="cardNumber" placeholder="16 ספרות" maxlength="16" pattern="[0-9]{16}" required>
              <div class="invalid-feedback">נא להזין 16 ספרות.</div>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">3 ספרות בגב (CVV)</label>
              <input type="text" class="form-control" id="cvv" placeholder="123" maxlength="3" pattern="[0-9]{3}" required>
              <div class="invalid-feedback">3 ספרות.</div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fs-5 mt-3">אישור ותשלום</button>
        </form>

      </div>
    </div>
  </div>

  <div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center p-4">
        <h3 class="text-success mb-3">הרכישה הושלמה בהצלחה!</h3>
        <p id="modalMessage" class="fs-5 text-muted"></p>
        <div>
          <button type="button" class="btn btn-success px-4" id="homeBtn">חזרה לחנות</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
